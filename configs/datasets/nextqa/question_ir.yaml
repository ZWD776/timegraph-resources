schema_version: nextqa_question_only_llm_ir_config_v1

ir:
  profile_name: nextqa_question_only_llm_ir_v3
  provider: openai_compatible
  model: gpt-5.6-luna
  api_base_url: https://kekeshop.top/v1
  api_base_url_env_var: OPENAI_BASE_URL
  endpoint_path: /chat/completions
  api_key_env_var: OPENAI_API_KEY
  api_key_pool_env_var: OPENAI_API_KEYS
  timeout_sec: 300.0
  temperature: 0.1
  max_tokens: 900
  max_attempts: 2
  thinking_enabled: false
  retry_backoff_sec: 1.0
  retry_jitter_sec: 0.25
