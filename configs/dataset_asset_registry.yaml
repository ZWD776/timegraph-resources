registry_version: dataset_asset_registry_v3
status: owned_mainlines_cleanup_completed
destructive_actions_enabled: false
migration_actions_enabled: true
policy:
  dataset_order:
  - navqa
  - nextqa
  - openeqa
  equal_first_class_datasets: true
  shared_core_is_dataset_neutral: true
  dataset_to_dataset_strategy_imports_allowed: false
  same_interface_not_identical_algorithms: true
  active_runtime_may_read_archive: false
  archive_root: archive/legacy_20260928
  default_for_unclassified: hold_for_review
  storage_minimum_reserve_gib: 20
  deletion_requires_verified_scope: true
target_layout:
  dataset_template:
    source: datasets/<dataset>/source
    graphs: datasets/<dataset>/graphs
    indexes: datasets/<dataset>/indexes
    ir: datasets/<dataset>/ir
    retrieval: datasets/<dataset>/retrieval
    runs: datasets/<dataset>/runs
    reports: datasets/<dataset>/reports
    cache: datasets/<dataset>/cache
    scratch: datasets/<dataset>/scratch
  core: src/vlkg/core
  code: src/vlkg/datasets/<dataset>
  scripts: scripts/datasets/<dataset>
  tests: tests/datasets/<dataset>
  docs: docs/datasets/<dataset>
  entrypoint: scripts/datasets/pipeline.py --dataset <dataset> --stage <operation>
datasets:
